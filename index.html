<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chris-Arnaud Koffié — Entrepreneur du numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141210;--bg2:#1c1916;--ink:#f1ebe0;--mut:#a39a8b;--gold:#c9a96e;--line:rgba(201,169,110,.22);--cream:#efe7d8;--cream-ink:#1a1612;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.1;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(20,18,16,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold)}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{color:var(--mut)}nav ul a:hover{color:var(--ink)}
.btn{display:inline-block;border-radius:999px;padding:13px 26px;border:1px solid var(--gold);color:var(--ink);font-size:14px;font-weight:400;transition:.25s}
.btn.fill{background:var(--gold);color:var(--cream-ink)}
.btn:hover{background:var(--gold);color:var(--cream-ink)}
.btn.fill:hover{background:transparent;color:var(--ink)}
.hero{padding:84px 0 72px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:640px;height:640px;right:-200px;top:-120px;background:radial-gradient(circle,rgba(201,169,110,.2),transparent 65%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center;position:relative}
.hero h1{font-size:clamp(40px,7vw,84px);letter-spacing:-.01em}
.hero h1 i{color:var(--gold)}
.hero p.lead{max-width:520px;color:var(--mut);font-size:17px;margin:26px 0 34px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.photo{aspect-ratio:4/5;border:1px solid var(--line);border-radius:32px;background:radial-gradient(circle at 50% 30%,rgba(201,169,110,.28),transparent 60%),linear-gradient(160deg,#241f19,#0f0d0b);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.photo img{width:100%;height:auto;max-height:100%;object-fit:contain;display:block}
.band{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;color:var(--mut);font-size:14px}
.band .wrap{display:flex;gap:10px 34px;flex-wrap:wrap;justify-content:space-between}
section{padding:96px 0}
.cream{background:var(--cream);color:var(--cream-ink)}
.cream .mut{color:#6b6255}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}
h2{font-size:clamp(32px,4.6vw,52px);margin-bottom:22px}
.about p{margin:0 0 16px;max-width:560px}
.facts{margin-top:28px;border-top:1px solid rgba(26,22,18,.2)}
.facts div{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid rgba(26,22,18,.2);font-size:15px}
.facts b{font-weight:500}
.sec-head{max-width:560px;margin-bottom:46px}
.sec-head p{color:var(--mut);margin:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.card{position:relative;border-radius:28px;padding:34px 30px;border:1px solid var(--line);background:linear-gradient(155deg,#221e19,#16130f);overflow:hidden;transition:border-color .3s}
.card::before{content:"";position:absolute;top:-90px;left:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(201,169,110,.17),transparent 70%)}
.card:hover{border-color:var(--gold)}
.card>*{position:relative}
.card.a{grid-column:span 4}.card.b{grid-column:span 2}.card.c{grid-column:span 3}.card.d{grid-column:span 3}
.role{color:var(--gold);font-size:14px;margin-bottom:12px}
.card h3{font-size:30px;margin-bottom:12px}
.card p{color:var(--mut);margin:0 0 18px;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.tags li{border-radius:999px;font-size:12.5px;padding:4px 14px;border:1px solid var(--line);color:var(--ink)}
.contact{text-align:center}
.contact h2{max-width:720px;margin:0 auto 20px}
.contact p{color:var(--mut);max-width:480px;margin:0 auto 34px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hero .wrap>*{animation:in .9s both}.hero .wrap>*:last-child{animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:820px){
nav ul{display:none}
.hero{padding:48px 0}
.hero .wrap,.about{grid-template-columns:1fr;gap:36px}
.photo{max-width:300px}
section{padding:68px 0}
.card.a,.card.b,.card.c,.card.d{grid-column:span 6}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}

.page{display:none}.page.on{display:block;animation:in .6s both}
nav ul a[aria-current]{color:var(--gold)}
.phead h1{font-size:clamp(38px,6vw,68px)}.phead p{color:var(--mut);max-width:540px;margin:18px 0 0}
.list{margin:16px 0 0;padding:0;list-style:none;color:var(--mut);font-size:15px}
.list li{padding:9px 0;border-top:1px solid var(--line)}
.shot{aspect-ratio:16/9;border-radius:18px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-size:13px;margin-bottom:22px;background:rgba(201,169,110,.05)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card.x{grid-column:auto}
@media(max-width:820px){
nav .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:6px}
nav .btn{display:none}
nav ul{display:flex;order:3;width:100%;overflow-x:auto;gap:22px;padding:8px 0;white-space:nowrap}
.g2,.g3{grid-template-columns:1fr}.phead{padding-top:44px}}

body{overflow-x:hidden}h1,h2,h3,p{overflow-wrap:break-word}img{max-width:100%}
@media(max-width:960px){.g3{grid-template-columns:1fr 1fr}.g3>:last-child:nth-child(odd){grid-column:1/-1}}
nav{background:rgba(10,9,8,.75);transition:background .3s}
nav.sc{background:rgba(10,9,8,.95)}
nav .wrap{justify-content:space-between}
.hero{padding:0 0 70px;background:var(--bg);overflow:hidden}
.hero::before{right:auto;left:50%;transform:translateX(-50%);top:40px;width:820px;height:820px;background:radial-gradient(circle,rgba(201,169,110,.3),rgba(201,169,110,.08) 45%,transparent 68%)}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.hero .wrap>*{animation:none}
.pic{width:min(560px,92vw);will-change:transform;-webkit-mask-image:linear-gradient(#000 52%,transparent 97%);mask-image:linear-gradient(#000 52%,transparent 97%)}
.pic img{width:100%;height:auto;display:block}
.htxt{position:relative;z-index:2;margin-top:calc(-1 * clamp(110px,20vw,210px));max-width:860px;animation:in 1s .15s both}
.hero h1{font-size:clamp(34px,6vw,70px)}
.hero p.lead{margin:22px auto 30px}
.cta{justify-content:center}
.phead{padding-top:72px;padding-bottom:8px;padding-left:22px;padding-right:22px}

.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
@media(max-width:820px){.phead{padding-top:44px}.hero{padding-bottom:50px}}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}.pic{transform:none!important}}
